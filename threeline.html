<!DOCTYPE html>
<html>
<head>
    <title>ElectroZone</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            background-color:red;
            color: white;
            padding: 12px 15px;
        }

        /* Hamburger */
        .menu-icon {
            cursor: pointer;
            margin-right: 15px;
        }

        .line {
            width: 28px;
            height: 3px;
            background-color: white;
            margin: 5px 0;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
        }

        .logo h2 {
            color:white;
            margin: 0;
        }

        .logo h3 {
            margin: 0;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -240px;
            width: 240px;
            height: 100%;
            background-color:white;
            color: white;
            transition: 0.3s;
            box-shadow: 2px 0 6px rgba(0,0,0,0.3);
        }

        .sidebar.open {
            left: 0;
        }

        /* Back button */
        .back-btn {
            background-color: #1abc9c;
            padding: 14px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .back-btn:hover {
            background-color: #16a085;
        }

        /* Menu items */
        .sidebar a {
            display: block;
            padding: 14px 20px;
            color: black;
            text-decoration: none;
            font-size: 16px;
        }

        .sidebar a:hover {
            background-color: #1abc9c;
        }

    </style>

</head>
<body>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">

    <!-- Back Button -->
    <div class="back-btn" onclick="toggleSidebar()">
        ← Back
    </div>

    <a href="#">My Orders</a>
    <a href="#">Products Review</a>

</div>

<!-- Header -->
<div class="header">

    <!-- Hamburger -->
    <div class="menu-icon" onclick="toggleSidebar()">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <!-- Logo -->
    <div class="logo">
        <h2>E</h2>
        <h3>lectroZone.in</h3>
    </div>

</div>

<script>
    function toggleSidebar() {
        var sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("open");
    }
</script>

</body>
</html>
